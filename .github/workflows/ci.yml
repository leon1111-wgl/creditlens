name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: python scripts/evaluate_controls.py
      - run: python -m compileall -q creditlens scripts
      - run: python scripts/check_artifacts.py
      - name: Check browser JavaScript syntax
        run: |
          node --check artifacts/workbench-syntax.js
          node --check artifacts/review-syntax.js
          node --check artifacts/research-syntax.js
