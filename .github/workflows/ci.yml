name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install Pillow==13.0.0
      - run: python -m unittest discover -s tests -v
      - run: python scripts/evaluate_controls.py
      - run: python scripts/verify_research_export.py artifacts/research-task-demo.json
      - run: python scripts/verify_research_export.py artifacts/research-cash-flow-demo.json
      - run: python scripts/verify_explanation_export.py artifacts/explanation-review-demo.json
      - run: python scripts/verify_explanation_export.py artifacts/explanation-review-returned-demo.json
      - run: python scripts/replay_research_scenarios.py
      - run: python scripts/evaluate_currency_diagnostic.py
      - run: python scripts/evaluate_evidence_guard.py
      - run: python scripts/evaluate_document_inputs.py
      - run: python scripts/replay_document_preparation.py
      - run: python scripts/evaluate_preparation_history.py
      - run: python scripts/evaluate_cross_page_evidence.py
      - run: python scripts/evaluate_table_lookup.py --verify-saved
      - run: python scripts/evaluate_word_table_lookup.py --verify-saved
      - run: python scripts/replay_reference_review.py
      - run: python scripts/verify_preparation_export.py artifacts/document-preparation-replay.json --attempt-index 2 --check-current
      - run: python scripts/evaluate_research_acceptance.py
      - run: python scripts/evaluate_company_attribution.py
      - run: python -m compileall -q creditlens scripts
      - run: python scripts/check_artifacts.py
      - run: node scripts/check_preparation_write_intent.js
      - run: node scripts/check_preparation_current_view.js
      - run: node scripts/check_cross_page_state.js
      - run: node scripts/check_table_lookup_state.js
      - run: node scripts/check_reference_review_state.js
      - name: Check browser JavaScript syntax
        run: |
          node --check artifacts/workbench-syntax.js
          node --check artifacts/review-syntax.js
          node --check artifacts/research-syntax.js
          node --check artifacts/documents-syntax.js
          node --check artifacts/experiments-syntax.js
          node --check artifacts/transfer-syntax.js
          node --check artifacts/tasks-syntax.js
          node --check artifacts/explanation-reviews-syntax.js
          node --check artifacts/preparation-syntax.js
          node --check artifacts/cross-page-syntax.js
          node --check artifacts/table-lookup-syntax.js
          node --check artifacts/reference-review-syntax.js
