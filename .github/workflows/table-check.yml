name: table-check
# 截图核对: the visitor flow with the real in-browser OCR (onnxruntime-web WASM + PP-OCRv5 mobile, downloaded
# from the pinned URLs on the runner) at 1440 and 375 px, light and dark; hidden without WASM SIMD; tampered
# runtime refused; cancel. Real OCR runs only here, never on a developer machine.
on:
  push:
    paths: ["web/src/tablecheck/**", "creditlens/table-check.*", "configs/table-check.json", "scripts/table_check_actions.mjs", "scripts/fetch_table_models.py", "scripts/export_static_demo.py", ".github/workflows/table-check.yml"]
  pull_request:
    paths: ["web/src/tablecheck/**", "creditlens/table-check.*", "configs/table-check.json", "scripts/table_check_actions.mjs", "scripts/fetch_table_models.py", "scripts/export_static_demo.py", ".github/workflows/table-check.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python scripts/export_static_demo.py --output site
      - run: python scripts/fetch_table_models.py --into site/models/pp-ocrv5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: npm install --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Visitor flow with real OCR
        run: node scripts/table_check_actions.mjs --mode check --site site --out table-out 2>&1 | tee table-out-log.txt; exit ${PIPESTATUS[0]}
      - if: always()
        run: cat table-out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-check-${{ github.run_id }}
          path: |
            table-out/
            table-out-log.txt
          retention-days: 14
