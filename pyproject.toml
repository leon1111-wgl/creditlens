[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creditlens"
version = "0.24.0"
description = "Source-linked credit review workflows, bounded model plans and reproducible financial evaluation"
requires-python = ">=3.11"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1"]

[tool.setuptools.package-data]
creditlens = ["workbench.html", "review.html", "research.html", "documents.html", "experiments.html", "transfer.html", "tasks.html", "explanation-reviews.html", "preparation.html", "cross-page.html", "table-lookup.html", "reference-review.html", "margin.html"]

[tool.setuptools.packages.find]
include = ["creditlens*"]
